<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Magazyn i Finanse</title>
    <link rel="stylesheet" href="https://unpkg.com/spectre.css/dist/spectre.min.css">
    <style>
        body {
            padding: 2rem;
        }
        .card {
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-primary">Stan konta: <strong>{{ saldo }}</strong> zł</h1>

        <div class="card">
            <div class="card-header"><h2 class="card-title">Magazyn</h2></div>
            <div class="card-body">
                {% if magazyn %}
                    <ul>
                        {% for produkt, ilosc in magazyn.items() %}
                            <li>{{ produkt }}: {{ ilosc }} szt.</li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p>Magazyn jest pusty.</p>
                {% endif %}
            </div>
        </div>

        <div class="columns">
            <div class="column col-4">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Zakup</h3></div>
                    <div class="card-body">
                        <form method="post">
                            <input type="hidden" name="zakup">
                            <div class="form-group">
                                <label>Nazwa</label>
                                <input class="form-input" name="nazwa">
                            </div>
                            <div class="form-group">
                                <label>Cena</label>
                                <input class="form-input" name="cena" type="number" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Ilość</label>
                                <input class="form-input" name="ilosc" type="number">
                            </div>
                            <button class="btn btn-primary" type="submit">Zatwierdź</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="column col-4">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Sprzedaż</h3></div>
                    <div class="card-body">
                        <form method="post">
                            <input type="hidden" name="sprzedaz">
                            <div class="form-group">
                                <label>Nazwa</label>
                                <input class="form-input" name="nazwa">
                            </div>
                            <div class="form-group">
                                <label>Ilość</label>
                                <input class="form-input" name="ilosc" type="number">
                            </div>
                            <div class="form-group">
                                <label>Cena (sprzedażowa)</label>
                                <input class="form-input" name="cena" type="number" step="0.01">
                            </div>
                            <button class="btn btn-success" type="submit">Sprzedaj</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="column col-4">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Zmiana salda</h3></div>
                    <div class="card-body">
                        <form method="post">
                            <input type="hidden" name="saldo">
                            <div class="form-group">
                                <label>Wartość</label>
                                <input class="form-input" name="wartosc" type="number" step="0.01">
                            </div>
                            <button class="btn btn-warning" type="submit">Zmień</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <p><a class="btn btn-link" href="{{ url_for('historia') }}">Zobacz historię</a></p>
    </div>
</body>
</html>
